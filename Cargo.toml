[package]
name = "rettui"
version = "1.10.0"
edition = "2024"
description = "Terminal Reticulum client: LXMF messaging and NomadNet browsing"
# rsReticulum, rsLXMF and rsNomad are AGPL-3.0-or-later.
license = "AGPL-3.0-or-later"

[dependencies]
# Reticulum / LXMF / NomadNet, vendored as git submodules under deps/
# (the libraries expect rsReticulum as a sibling of rsLXMF and rsNomad).
rns-runtime = { path = "deps/rsReticulum/crates/rns-runtime", features = ["serial", "rnode-tcp"] }
rns-identity = { path = "deps/rsReticulum/crates/rns-identity" }
rns-crypto = { path = "deps/rsReticulum/crates/rns-crypto" }
# Control queries (blocking an identity).
rns-transport = { path = "deps/rsReticulum/crates/rns-transport" }
# A packet's hash, to ask how it was heard.
rns-wire = { path = "deps/rsReticulum/crates/rns-wire" }
lxmf-core = { path = "deps/rsLXMF/crates/lxmf-core" }
nomad-core = { path = "deps/rsNomad/crates/nomad-core" }
# Hosting an RRC hub: rsRRCD's hub logic (it expects rsReticulum and rsRRC
# as its siblings), and the YAML its configuration file is written in.
rsrrcd = { path = "deps/rsRRCD", default-features = false }
serde-saphyr = "1.1"
# Games over LXMF (LRGP): Tic-Tac-Toe, Four in a Row and Chess, their rules
# and sessions. On a branch of ours with rusqlite at rettui's version.
lrgp = { path = "deps/lrgp-rs" }
# Pictures for LXMF addresses (identicons), as Ratspeak draws them.
lxmface = { path = "deps/LXMFace" }

# TUI
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
unicode-width = "0.2"
unicode-segmentation = "1"
unicode-normalization = "0.1"
# Emoji names, groups and shortcodes, for the emoji pickers.
emojis = "0.9"
# Same decoders nomad-core already builds (NomadNet serves WebP media).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"] }
rmpv = "1"
# Terminal graphics (Kitty) with capability detection.
ratatui-image = { version = "11", default-features = false, features = ["crossterm"] }
base64 = "0.22"
# RRC (Reticulum Relay Chat) wire format.
ciborium = "0.2"
rand = "0.8"
# Web UI (`--web`).
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
# Web Push (RFC 8291/8292) for the web UI: VAPID keys and message
# encryption, and HTTPS to the browsers' push services (rustls with bundled
# roots, so no system certificates or OpenSSL are needed).
p256 = { version = "0.14", default-features = false, features = ["ecdh", "ecdsa", "sha256", "std"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "proxy-from-env"] }
# What rettui's own HTTPS requests trust (see src/https.rs): the bundled
# roots, as ureq has them, and this computer's own, as browsers do.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
rustls-native-certs = "0.8"
# HTTPS for the web UI: rustls on ring (as ureq already builds it), and
# rettui's own small certificate authority when no certificate is given.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls-pki-types = { version = "1", features = ["std"] }
# Certificate dates, as rcgen takes them.
time = { version = "0.3", default-features = false }
# QR codes for LXMF paper messages (drawn in the terminal, SVG in the web UI).
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# Finding them in pictures (to read a paper message from a photo).
rqrr = { version = "0.11", default-features = false }

# Runtime and support
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: times saved as seconds read back exactly as they were.
serde_json = { version = "1", features = ["float_roundtrip"] }
flate2 = "1"
hex = "0.4"
directories = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
codec2 = { path = "vendor/codec2" }
# Offline map tiles from an MBTiles file (SQLite), for the web UI's map;
# SQLite built in, so nothing needs installing.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
# Unpacking a release to update to (see src/update/install.rs): .tar.gz
# for Linux and macOS, .zip for Windows.
tar = { version = "0.4", default-features = false }
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
# Bounded terminal capability probe (poll/read on stdin).
libc = "0.2"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
# Desktop notifications on Windows and macOS (on Linux and the BSDs rettui
# speaks D-Bus itself, below): without its D-Bus side, which these don't use.
notify-rust = { version = "4.18.2", default-features = false }

[target.'cfg(windows)'.dependencies]
# Bringing the console window forward when a notification is clicked (the
# version the rest already uses).
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
# System clipboard (X11 and Wayland); OSC 52 covers SSH sessions. Android
# has none a program outside an app can reach.
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_os = "android")'.dependencies]
# The Android app loads rettui as a library and calls it through JNI; the
# Java VM is handed on to rsReticulum (AutoInterface, USB RNodes). The same
# versions rsReticulum uses.
jni = "0.19"
rns-interface = { path = "deps/rsReticulum/crates/rns-interface" }
# RNodes over Bluetooth: rsReticulum's through btleplug, which wants its
# own JNI start (with the newer jni it uses) and Java classes in the app.
rns-runtime = { path = "deps/rsReticulum/crates/rns-runtime", features = ["ble"] }
btleplug = "=0.13.4"
jni22 = { package = "jni", version = "0.22" }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "android"))))'.dependencies]
# Desktop notifications over D-Bus, on the connection that hears their
# clicks, on tokio (rettui's runtime).
zbus = { version = "6", default-features = false, features = ["tokio", "service"] }

[dev-dependencies]
# Driving the web UI's router in tests, as a browser would (already built
# for axum).
tower = { version = "0.5", default-features = false, features = ["util"] }

# Image decoding is very slow unoptimised (seconds per picture), so debug
# builds optimise the decoders.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.moxcms]
opt-level = 3
[profile.dev.package.rqrr]
opt-level = 3
# Store compression (saved in the background, but still quicker to finish).
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.crc32fast]
opt-level = 3
[profile.dev.package.flate2]
opt-level = 3
# Reticulum's crypto and packet handling. Unoptimised, a debug build can't
# keep up with bursts of announces: a shared instance (rnsd) stops sending
# to clients that fall behind, and announces are lost.
[profile.dev.package.curve25519-dalek]
opt-level = 3
[profile.dev.package.ed25519-dalek]
opt-level = 3
[profile.dev.package.x25519-dalek]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
[profile.dev.package.aes]
opt-level = 3
[profile.dev.package.cbc]
opt-level = 3
[profile.dev.package.hkdf]
opt-level = 3
[profile.dev.package.rns-crypto]
opt-level = 3
[profile.dev.package.rns-identity]
opt-level = 3
[profile.dev.package.rns-wire]
opt-level = 3
[profile.dev.package.rns-transport]
opt-level = 3
[profile.dev.package.rns-interface]
opt-level = 3
# Measuring text by grapheme, for the page layout and the editors.
[profile.dev.package.unicode-segmentation]
opt-level = 3
[profile.dev.package.unicode-width]
opt-level = 3
