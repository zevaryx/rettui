name: Release

# Pushing a version tag (v1.2.0, or v1.3.0-rc.1 for a prerelease) builds
# every platform, publishes the Docker image to GitHub's container registry
# and makes a GitHub release with the archives attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)"
            exit 1
          fi

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  docker:
    name: Docker image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: rettui-*-linux-gnu
          path: artifacts
          merge-multiple: true

      # The image copies these in (the Dockerfile's `prebuilt` stage), so
      # both architectures build quickly and without emulation.
      - name: Unpack the Linux binaries
        run: |
          mkdir -p dist
          tar -xzOf artifacts/*-x86_64-unknown-linux-gnu.tar.gz --wildcards '*/rettui' > dist/rettui-amd64
          tar -xzOf artifacts/*-aarch64-unknown-linux-gnu.tar.gz --wildcards '*/rettui' > dist/rettui-arm64

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 1.2.0, 1.2, 1 and latest; a prerelease gets only its own tag.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: prebuilt
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: GitHub release
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: rettui-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}"
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "rettui $TAG" \
            --notes "Docker: \`docker pull $image\`" \
            --generate-notes \
            "${prerelease[@]}"
