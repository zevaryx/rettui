name: Release

# Pushing a version tag (v1.2.0, or v1.3.0-rc.1 for a prerelease) builds
# every platform, publishes the Docker image to GitHub's container registry
# and makes a GitHub release with the archives and Debian packages
# attached (and, for a release, a Homebrew formula and the AUR's PKGBUILD),
# and the tag's section of CHANGELOG.md as its notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches Cargo.toml
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)"
            exit 1
          fi
      # Before anything is built: a release needs its notes.
      - name: CHANGELOG.md has the release
        run: .github/scripts/release-notes.sh "$GITHUB_REF_NAME" > /dev/null

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.ref_name }}

  docker:
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      # 1.2.0, 1.2, 1 and latest; a prerelease gets only its own tag.
      tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=semver,pattern={{major}}

  release:
    name: GitHub release
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            CHANGELOG.md
            .github/scripts

      - uses: actions/download-artifact@v8
        with:
          pattern: rettui-*
          path: dist
          merge-multiple: true

      # Debian packages of the Linux binaries (in the checksums too).
      - name: Debian packages
        run: |
          for archive in dist/*-unknown-linux-gnu.tar.gz; do
            .github/scripts/package-deb.sh "$GITHUB_REF_NAME" "$archive" dist
          done

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      # For a Homebrew tap and the AUR's rettui-bin, from the checksums (a
      # release's, not a prerelease's): attached, to publish from.
      - name: Homebrew formula and AUR package
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          .github/scripts/homebrew-formula.sh "$GITHUB_REF_NAME" dist/SHA256SUMS > dist/rettui.rb
          .github/scripts/aur-pkgbuild.sh "$GITHUB_REF_NAME" dist/SHA256SUMS aur
          cp aur/PKGBUILD dist/PKGBUILD

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${TAG#v}"
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          {
            .github/scripts/release-notes.sh "$TAG"
            printf '\n**Docker:** `docker pull %s`\n' "$image"
          } > notes.md
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "rettui $TAG" \
            --notes-file notes.md \
            "${prerelease[@]}"
