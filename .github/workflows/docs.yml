name: Docs

# Builds the documentation site from wiki/ with Zensical (see docs/README.md)
# and publishes it to GitHub Pages from main, so the site describes the
# released version (the wiki follows dev too). Pull requests only build it:
# a link to a page or heading that doesn't exist fails the build.
#
# Pages must publish from GitHub Actions: Settings > Pages > Build and
# deployment > Source: GitHub Actions.

on:
  push:
    branches: [main]
    paths:
      - "wiki/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "wiki/**"
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One build per branch at a time. A pull request's newer push cancels the
# build before it; publishing from main is never cut short.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install Zensical
        run: pip install -r docs/requirements.txt
      - name: Build the site
        run: python3 docs/build.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/site

  deploy:
    name: Publish
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
