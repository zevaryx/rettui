name: Android

# A test build of the Android app (android/): Actions > Android > Run
# workflow, then download the APK from the run's Artifacts. It runs on every
# push to feature/android too, since GitHub offers Run workflow only for
# workflows on the default branch.
#
# Each build is signed with the key in the ANDROID_KEYSTORE secret (a
# keystore, base64), if there is one, so a new APK installs over the last;
# without it, with the runner's own debug key, which changes every run (so
# uninstall the app before installing another).
on:
  workflow_dispatch:
    inputs:
      abis:
        description: Phones it runs on (arm64-v8a is almost every phone; x86_64 the emulator)
        type: choice
        default: arm64-v8a
        options:
          - arm64-v8a
          - x86_64
          - arm64-v8a x86_64
  push:
    branches: [feature/android]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  NDK_VERSION: 28.2.13676358

jobs:
  apk:
    name: APK
    runs-on: ubuntu-latest
    env:
      ABIS: ${{ inputs.abis || 'arm64-v8a' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Rust targets
        run: |
          targets=""
          for abi in $ABIS; do
            case "$abi" in
              arm64-v8a) targets="$targets aarch64-linux-android" ;;
              x86_64) targets="$targets x86_64-linux-android" ;;
            esac
          done
          rustup target add $targets

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ env.ABIS }}

      - name: Build rettui
        run: android/build-rust.sh $ABIS

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/rettui.keystore"
            echo "RETTUI_KEYSTORE=$RUNNER_TEMP/rettui.keystore" >> "$GITHUB_ENV"
          fi

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the APK
        working-directory: android
        env:
          RETTUI_VERSION_CODE: ${{ github.run_number }}
          RETTUI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RETTUI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          RETTUI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleDebug --no-daemon

      - name: Name it
        id: name
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          name="rettui-$version-${GITHUB_SHA::7}-${ABIS// /-}"
          mv android/app/build/outputs/apk/debug/app-debug.apk "$name.apk"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.name.outputs.name }}
          path: ${{ steps.name.outputs.name }}.apk
          if-no-files-found: error
