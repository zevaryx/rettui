name: Desktop

# The desktop app (desktop/, rettui-desktop): rettui's web UI in a window of
# its own. Installers for every platform the Build workflow makes,
# a plain archive of the program for each (what the built-in updater and
# the AUR's rettui-desktop-bin install), and for Linux a Flatpak bundle.
# They're signed when the signing secrets are set, and unsigned when not
# (see the Signing step). Run it from Actions > Desktop > Run
# workflow, or push to feature/desktop or feat/desktop; the Release workflow
# calls it and attaches what it makes to the same release.
on:
  push:
    branches: [feature/desktop, feat/desktop]
  workflow_dispatch:
    inputs:
      linux-only:
        description: Only the Linux builds
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: Version in the file names (the tag, for a release; else Cargo.toml's and the commit)
        type: string
        default: ""
      linux-only:
        type: boolean
        default: false
    # All optional: a release without them is built unsigned.
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    # As the Build workflow: the oldest Linux runners for the widest glibc
    # support. Ubuntu 22.04 has WebKitGTK 4.1, which Tauri 2 needs.
    runs-on: >-
      ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'ubuntu-22.04-arm'
      || contains(matrix.target, 'linux') && 'ubuntu-22.04'
      || contains(matrix.target, 'windows') && 'windows-latest'
      || 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        target: >-
          ${{ fromJSON(inputs.linux-only
          && '["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]'
          || '["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: desktop-${{ matrix.target }}

      - name: WebKitGTK
        if: contains(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf file

      - name: Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Version
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          # Not a release: name it after Cargo.toml's version and the commit.
          if [ -z "$VERSION" ]; then
            VERSION="v$cargo_version-${GITHUB_SHA::7}"
          fi
          echo "name=${VERSION//\//-}" >> "$GITHUB_OUTPUT"
          # The installers' own version: rettui's, which a release's tag is.
          echo "app=$cargo_version" >> "$GITHUB_OUTPUT"

      # Code signing is optional: with none of these secrets set (the
      # default, and for forks and pull requests) the installers are built
      # unsigned, exactly as before. Set them in the repository's secrets
      # to sign (see wiki/Development.md):
      #   macOS:   APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
      #            APPLE_SIGNING_IDENTITY; to notarize as well, APPLE_ID,
      #            APPLE_PASSWORD (an app-specific password), APPLE_TEAM_ID.
      #   Windows: WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD.
      - name: Signing
        id: signing
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          echo "config={}" >> "$GITHUB_OUTPUT"
          case "$TARGET" in
            *windows*)
              if [ -z "$WINDOWS_CERTIFICATE" ]; then
                echo "No Windows certificate: the installer is unsigned."
                exit 0
              fi
              printf '%s' "$WINDOWS_CERTIFICATE" | base64 -d > "$RUNNER_TEMP/cert.pfx"
              thumbprint="$(pwsh -NoProfile -Command "\$p = ConvertTo-SecureString \$env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force; (Import-PfxCertificate -FilePath '$RUNNER_TEMP/cert.pfx' -CertStoreLocation Cert:\\CurrentUser\\My -Password \$p).Thumbprint")"
              rm -f "$RUNNER_TEMP/cert.pfx"
              echo "config={\"bundle\":{\"windows\":{\"certificateThumbprint\":\"$thumbprint\",\"digestAlgorithm\":\"sha256\",\"timestampUrl\":\"http://timestamp.digicert.com\"}}}" >> "$GITHUB_OUTPUT"
              ;;
            *apple*)
              [ -n "$APPLE_CERTIFICATE" ] || echo "No Apple certificate: the app is unsigned."
              ;;
          esac

      - name: Build
        shell: bash
        working-directory: desktop
        env:
          TARGET: ${{ matrix.target }}
          SIGNING_CONFIG: ${{ steps.signing.outputs.config }}
          # Tauri signs (and notarizes, with the Apple ID) when these are
          # set; empty ones are removed below so they count as unset.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_VERSION: ${{ steps.version.outputs.app }}
          # A release build for its target, which updates itself from the
          # archives below (see src/update/install.rs).
          RETTUI_RELEASE_TARGET: ${{ matrix.target }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            [ -n "${!name}" ] || unset "$name"
          done
          # Without a certificate there is nothing to sign with.
          [ -n "${APPLE_CERTIFICATE:-}" ] && [ -n "${APPLE_SIGNING_IDENTITY:-}" ] || unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          case "$TARGET" in
            x86_64-unknown-linux-gnu) bundles=deb,appimage ;;
            *linux*) bundles=deb ;;
            *windows*) bundles=nsis ;;
            *) bundles=app,dmg ;;
          esac
          cargo tauri build --target "$TARGET" --bundles "$bundles" --config "{\"version\": \"$APP_VERSION\"}" --config "$SIGNING_CONFIG" -- --locked

      - name: Package
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          name="rettui-desktop-$VERSION-$TARGET"
          bundle="target/$TARGET/release/bundle"
          mkdir -p dist
          shopt -s nullglob
          for file in "$bundle"/deb/*.deb "$bundle"/appimage/*.AppImage "$bundle"/nsis/*.exe "$bundle"/dmg/*.dmg; do
            cp "$file" "dist/$name.${file##*.}"
          done
          # The program alone, as the Build workflow packs rettui: what the
          # updater unpacks. For Linux with its icon and menu entry, for the
          # AUR and the Flatpak.
          mkdir -p "dist/$name"
          cp README.md LICENSE "dist/$name/"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/rettui-desktop.exe" "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          else
            cp "target/$TARGET/release/rettui-desktop" "dist/$name/"
            if [[ "$TARGET" == *linux* ]]; then
              cp desktop/linux/rettui-desktop.desktop "dist/$name/"
              cp desktop/icons/icon.png "dist/$name/rettui-desktop.png"
            fi
            tar -czf "dist/$name.tar.gz" -C dist "$name"
          fi
          rm -r "dist/$name"
          ls -l dist
          if [ -z "$(ls dist)" ]; then
            echo "::error::No installers in $bundle"
            exit 1
          fi

      # Named apart from the Build workflow's rettui-* artifacts, which the
      # Docker image is made from.
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # A Flatpak of the Linux build, on the GNOME runtime (which has WebKitGTK).
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    needs: build
    # The Linux builds are enough: another platform's failure doesn't stop it.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            Cargo.toml
            desktop/flatpak

      - uses: actions/download-artifact@v8
        with:
          name: desktop-${{ matrix.arch }}-unknown-linux-gnu
          path: artifacts

      - name: The archive, beside the manifest
        id: version
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          if [ -z "$VERSION" ]; then
            VERSION="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)-${GITHUB_SHA::7}"
          fi
          VERSION="${VERSION//\//-}"
          cp "artifacts/rettui-desktop-$VERSION-$ARCH-unknown-linux-gnu.tar.gz" desktop/flatpak/rettui-desktop.tar.gz
          echo "bundle=rettui-desktop-$VERSION-$ARCH-unknown-linux-gnu.flatpak" >> "$GITHUB_OUTPUT"

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: desktop/flatpak/io.github.zevaryx.rettui.yml
          bundle: ${{ steps.version.outputs.bundle }}
          arch: ${{ matrix.arch }}
          upload-artifact: false
          cache: false

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-flatpak-${{ matrix.arch }}
          path: ${{ steps.version.outputs.bundle }}
          if-no-files-found: error
