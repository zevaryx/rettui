name: Build

# Binaries for every platform, without making a release: Actions > Build >
# Run workflow, then download them from the run's Artifacts. The release
# and branch image workflows build with this too.
on:
  workflow_dispatch:
    inputs:
      linux-only:
        description: Only the Linux binaries
        type: boolean
        default: false
  workflow_call:
    inputs:
      version:
        description: Version in the archive names (the tag, for a release; else Cargo.toml's and the commit)
        type: string
        default: ""
      linux-only:
        description: Only the Linux binaries (all a Docker image needs)
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    # Linux builds use the oldest runners for the widest glibc support
    # (2.35). The vendored Reticulum library does not build for musl.
    runs-on: >-
      ${{ matrix.target == 'aarch64-unknown-linux-gnu' && 'ubuntu-22.04-arm'
      || contains(matrix.target, 'linux') && 'ubuntu-22.04'
      || contains(matrix.target, 'windows') && 'windows-latest'
      || 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        target: >-
          ${{ fromJSON(inputs.linux-only
          && '["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]'
          || '["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-apple-darwin"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        # Marks the binary as a release build for its target, which can
        # update itself (see src/update/install.rs).
        env:
          RETTUI_RELEASE_TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        id: package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: |
          # Not a release: name it after Cargo.toml's version and the commit.
          if [ -z "$VERSION" ]; then
            VERSION="v$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)-${GITHUB_SHA::7}"
          fi
          VERSION="${VERSION//\//-}"
          name="rettui-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp README.md "dist/$name/"
          cd dist
          if [[ "$TARGET" == *windows* ]]; then
            cp "../target/$TARGET/release/rettui.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
            echo "file=dist/$name.zip" >> "$GITHUB_OUTPUT"
          else
            cp "../target/$TARGET/release/rettui" "$name/"
            tar -czf "$name.tar.gz" "$name"
            echo "file=dist/$name.tar.gz" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: rettui-${{ matrix.target }}
          path: ${{ steps.package.outputs.file }}
          if-no-files-found: error
