name: Branch image

# Every push to a branch other than main publishes a Docker image named
# after the branch: pushing to `dev` gives ghcr.io/<owner>/rettui:dev (a
# branch like feature/x gives :feature-x). Tags don't run this; releases
# have their own workflow.
on:
  push:
    branches-ignore: [main]

permissions:
  contents: read

# A newer push to the branch replaces an unfinished run.
concurrency:
  group: branch-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      linux-only: true

  docker:
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    with:
      tags: type=ref,event=branch
      # Only releases move `latest`.
      flavor: latest=false
