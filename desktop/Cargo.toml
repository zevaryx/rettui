[package]
name = "rettui-desktop"
version = "1.10.0"
edition = "2024"
description = "rettui's web UI in a window of its own"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "rettui-desktop"
path = "src/main.rs"

[dependencies]
# rettui itself, run in this process: the same web UI the browser shows.
rettui = { path = ".." }
tauri = { version = "2.12", features = [] }
# Links that aren't rettui's open in the system's browser.
tauri-plugin-opener = "2.7"
# One copy at a time: a second start brings the first one's window up, as
# two on one data directory would fight over it.
tauri-plugin-single-instance = "2.5"
directories = "6"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }
