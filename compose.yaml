# rettui web UI.
#
#   git submodule update --init   # the Reticulum/LXMF/NomadNet libraries
#   docker compose up -d --build
#   docker compose logs rettui    # shows the login link (?token=...)
#
# Everything rettui keeps is in ./data next to this file, including the
# Reticulum config in ./data/reticulum/config (created on first start).

services:
  rettui:
    # To use a release image instead of building one, remove `build: .` and
    # set `image: ghcr.io/rettui-dev/rettui:latest`.
    build: .
    image: rettui:latest
    container_name: rettui
    restart: unless-stopped
    environment:
      # Files in ./data are owned by this user and group on the host
      # (see `id -u` and `id -g`).
      PUID: "1000"
      PGID: "1000"
    volumes:
      - ./data:/data
    ports:
      # Only this machine can connect: the web UI is plain HTTP, so on the
      # network the login link and everything shown would be readable by
      # anyone on it. To open it to other devices, publish it as "8740:8740"
      # and add `command: ["--https"]` to this service (see wiki/Docker.md):
      # the image itself accepts plain HTTP.
      - "127.0.0.1:8740:8740"
      # A transport node others connect to: needs, in
      # ./data/reticulum/config, `enable_transport = Yes` under [reticulum]
      # and a TCPServerInterface with listen_ip = 0.0.0.0 and
      # listen_port = 4242. Nothing listens here until then.
      - "4242:4242"
    # Reticulum's default AutoInterface finds peers on the local network by
    # multicast, which does not leave Docker's default network. Either add
    # an interface to ./data/reticulum/config (for example a TCPClientInterface
    # to a transport node), or share the host's network instead of `ports:`:
    # network_mode: host
    #
    # With network_mode: host the web UI is on every interface of the host
    # (there is no `ports:` to limit it): add `--https` as above, or do not
    # use it. On the default bridge network, other containers can also reach
    # the web UI's port, in clear text. The image always starts rettui with
    # --insecure-http (it accepts plain HTTP by itself), and says so in its log
    # even when the port is published on 127.0.0.1 only.
